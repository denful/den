name: Semantic PR
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  main:
    name: Check pull request title
    runs-on: ubuntu-latest
    steps:
      # Accepts `type: description`, `type(scope): description` and a breaking `!`,
      # with any lowercase type and any scope, e.g. `docs(standalone-home): ...`.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^[a-z][a-z0-9-]*(\([^()]+\))?!?: [^ ].*$'; then
            echo "ok: $TITLE"
          else
            echo "::error::Pull request title must look like 'type(scope): description' or 'type: description', for example 'docs(standalone-home): show how aspects read a home's own fields'. Got: $TITLE"
            exit 1
          fi
